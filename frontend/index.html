<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #10B981;
            --warning: #F59E0B;
            --border: #E5E7EB;
        }

        [data-theme="dark"] {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg: #111827;
            --card-bg: #1F2937;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h1, h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-danger {
            background-color: var(--danger);
        }

        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        button.btn-success {
            background-color: var(--success);
        }

        .toggle-link {
            text-align: center;
            margin-top: 1rem;
            color: var(--primary);
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
            min-height: 1.25rem;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-success { background-color: var(--success); }
        .toast-error { background-color: var(--danger); }
        .toast-info { background-color: var(--primary); }

        /* Views */
        #auth-view, #tasks-view {
            display: none;
        }

        /* Tasks Header */
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .tasks-header button {
            width: auto;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .filter-btn {
            background: none;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Task List */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            margin-bottom: 0.75rem;
            background: var(--card-bg);
        }

        .task-content h3 {
            margin-bottom: 0.25rem;
        }

        .task-content p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending {
            background-color: #FEF3C7;
            color: #92400E;
        }

        .status-completed {
            background-color: #D1FAE5;
            color: #065F46;
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
        }

        .task-actions button {
            padding: 0.5rem 1rem;
            width: auto;
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            .task-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .task-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="container">
        <!-- Theme Toggle -->
        <div style="text-align: right; margin-bottom: 1rem;">
            <button id="theme-toggle" style="width: auto; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); font-weight: bold; border-radius: 999px;">🌙 Dark Mode</button>
        </div>

        <!-- Auth View -->
        <div id="auth-view">
            <!-- App Branding -->
            <div style="text-align: center; margin: 3rem 0;">
                <div style="display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: white; width: 64px; height: 64px; border-radius: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </div>
                <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.025em;">Task Manager</h1>
                <p style="color: var(--text-muted); font-size: 1.125rem;">The only tool you need to organize your life.</p>
            </div>

            <div style="max-width: 450px; margin: 0 auto;">
                <!-- Login Form -->
                <div class="card" id="login-container">
                    <h2>Welcome back</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-username">Username</label>
                            <input type="text" id="login-username" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <div id="login-error" class="error-msg"></div>
                        <button type="submit" style="margin-top: 0.5rem; font-weight: bold;">Sign In</button>
                        <p class="toggle-link" onclick="toggleAuth('register')">Don't have an account? Sign up</p>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="card" id="register-container" style="display: none;">
                    <h2>Create an account</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-username">Username</label>
                            <input type="text" id="reg-username" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" required>
                        </div>
                        <div id="reg-error" class="error-msg"></div>
                        <button type="submit" style="margin-top: 0.5rem; font-weight: bold;">Create Account</button>
                        <p class="toggle-link" onclick="toggleAuth('login')">Already have an account? Sign In</p>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tasks View -->
        <div id="tasks-view">
            <div class="tasks-header">
                <h2>My Tasks</h2>
                <button class="btn-danger" onclick="logout()">Logout</button>
            </div>

            <div class="card">
                <h3>Create New Task</h3>
                <form id="task-form" style="margin-top: 1rem;">
                    <div class="form-group">
                        <input type="text" id="task-title" placeholder="Task Title" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="task-desc" placeholder="Task Description (Optional)">
                    </div>
                    <div id="task-error" class="error-msg"></div>
                    <button type="submit">Add Task</button>
                </form>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="loadTasks(null, this)">All</button>
                <button class="filter-btn" onclick="loadTasks(false, this)">Pending</button>
                <button class="filter-btn" onclick="loadTasks(true, this)">Completed</button>
            </div>

            <div id="tasks-list">
                <!-- Tasks will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // Use an empty string so the browser automatically fetches from the live URL instead of Localhost
        const API = "";
        
        // DOM Elements
        const authView = document.getElementById('auth-view');
        const tasksView = document.getElementById('tasks-view');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const taskForm = document.getElementById('task-form');
        const tasksList = document.getElementById('tasks-list');
        const themeToggle = document.getElementById('theme-toggle');

        let currentFilter = null;

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Theme Logic
        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.innerText = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
        });

        // Initialize apps
        function init() {
            // Setup Theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            // Setup Auth
            const token = localStorage.getItem('token');
            if (token) {
                showView('tasks');
                loadTasks();
            } else {
                showView('auth');
            }
        }

        function showView(view) {
            if (view === 'auth') {
                authView.style.display = 'block';
                tasksView.style.display = 'none';
            } else {
                authView.style.display = 'none';
                tasksView.style.display = 'block';
            }
        }

        function toggleAuth(type) {
            document.getElementById('login-container').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('register-container').style.display = type === 'register' ? 'block' : 'none';
            document.getElementById('login-error').innerText = '';
            document.getElementById('reg-error').innerText = '';
        }

        function logout() {
            localStorage.removeItem('token');
            showView('auth');
        }

        // Api wrapper with auth
        async function apiCall(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };

            if (token && !options.noAuth) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const isFormData = options.body instanceof URLSearchParams;
            if (isFormData) {
                delete headers['Content-Type']; // Let browser set form-urlencoded correctly
            }

            try {
                const response = await fetch(`${API}${endpoint}`, {
                    ...options,
                    headers: headers
                });
                
                if (response.status === 401 && !options.noAuth) {
                    logout();
                    throw new Error('Unauthorized');
                }

                if (response.status === 204) {
                    return null;
                }

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'An error occurred');
                }
                
                return data;
            } catch (error) {
                throw error;
            }
        }

        // Auth listeners
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = '';
            
            const params = new URLSearchParams();
            params.append('username', document.getElementById('login-username').value);
            params.append('password', document.getElementById('login-password').value);

            try {
                const data = await apiCall('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params,
                    noAuth: true
                });
                localStorage.setItem('token', data.access_token);
                loginForm.reset();
                showView('tasks');
                loadTasks();
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('reg-error');
            errorDiv.innerText = '';

            try {
                await apiCall('/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value,
                        email: document.getElementById('reg-email').value,
                        password: document.getElementById('reg-password').value
                    }),
                    noAuth: true
                });
                showToast('Registration successful! Please login.', 'success');
                toggleAuth('login');
                registerForm.reset();
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        });

        // Tasks Logic
        async function loadTasks(completed = null, btnObj = null) {
            if (completed !== undefined) {
                currentFilter = completed;
            }
            if (btnObj) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnObj.classList.add('active');
            }

            try {
                let url = '/tasks?skip=0&limit=100';
                if (currentFilter !== null) {
                    url += `&completed=${currentFilter}`;
                }
                
                const tasks = await apiCall(url);
                renderTasks(tasks);
            } catch (err) {
                console.error(err);
                if (err.message !== 'Unauthorized') {
                    showToast('Error loading tasks: ' + err.message, 'error');
                }
            }
        }

        function renderTasks(tasks) {
            tasksList.innerHTML = '';
            if (tasks.length === 0) {
                tasksList.innerHTML = '<p style="text-align:center; color: var(--text-muted)">No tasks found.</p>';
                return;
            }

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `
                    <div class="task-content">
                        <h3>${escapeHtml(task.title)}</h3>
                        ${task.description ? `<p>${escapeHtml(task.description)}</p>` : ''}
                        <span class="status-badge ${task.completed ? 'status-completed' : 'status-pending'}">
                            ${task.completed ? 'Completed' : 'Pending'}
                        </span>
                    </div>
                    <div class="task-actions">
                        ${!task.completed ? 
                            `<button class="btn-success" onclick="updateTask(${task.id}, true)">Complete</button>` : 
                            `<button onclick="updateTask(${task.id}, false)">Undo</button>`
                        }
                        <button class="btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
                tasksList.appendChild(div);
            });
        }

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('task-error');
            errorDiv.innerText = '';

            try {
                await apiCall('/tasks', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: document.getElementById('task-title').value,
                        description: document.getElementById('task-desc').value || null
                    })
                });
                taskForm.reset();
                loadTasks(currentFilter);
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        });

        async function updateTask(id, completed) {
            try {
                await apiCall(`/tasks/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ completed })
                });
                loadTasks(currentFilter);
            } catch (err) {
                showToast('Error updating task: ' + err.message, 'error');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            try {
                await apiCall(`/tasks/${id}`, {
                    method: 'DELETE'
                });
                loadTasks(currentFilter);
            } catch (err) {
                showToast('Error deleting task: ' + err.message, 'error');
            }
        }

        // Utils
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Run
        init();
    </script>
</body>
</html>
